name: soe
description: "SOE - Solution of Education : application mobile de tutorat à domicile (Cameroun)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  go_router: ^14.6.2

  dio: ^5.7.0

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  logger: ^2.5.0

  intl: ^0.20.2

  slang: ^4.4.0
  slang_flutter: ^4.4.0

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1

  flutter_google_places_sdk: ^0.3.7

  image_picker: ^1.1.2
  image_cropper: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  patrol: ^4.5.0
  patrol_finders: ^3.2.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3

  very_good_analysis: ^6.0.0

  flutter_launcher_icons: ^0.14.1

# Icône d'app SOE : ampoule blanche sur fond jaune #FFB000.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFB000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

patrol:
  app_name: SOE
  android:
    package_name: cm.soe.mobile
  ios:
    bundle_id: cm.soe.mobile
    app_name: Runner
